[project]
name = "newzeland-plants"
version = "0.1.0"
description = "Graph neural network analysis of phylogenetic and environmental information in New Zealand fern traits"
readme = "README"
requires-python = ">=3.12"
dependencies = [
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "optuna>=4.9.0",
    "plotly>=6.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "torch==2.14.1",
    "torch-geometric>=2.8.0.post1",
    # Optional compiled PyG extensions.
    "pyg-lib==0.9.0",
    "wandb>=0.28.1",
    "setuptools<81",
    "captum>=0.9.0",
    "ipykernel<7",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.9",
    "ipython>=9.17.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
# Dataset loading, environmental rasters, and phylogeny construction.
data = [
    "biopython>=1.87",
    "kerchunk>=0.2.10",
    "netcdf4>=1.7.4",
    "node2vec>=0.4.3",
    "networkx>=3.0",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0",
    "pyarrow>=18.0",
    "rioxarray>=0.23.0",
    "rpy2>=3.6,<3.7",
    "tqdm>=4.0",
    "xarray>=2024.1",
]
# Python implementations used alongside the R baselines in the full benchmark.
baselines = [
    "xgboost>=3.4.1",
]
# Optional interactive interface, archived outside the core benchmark workflow.
dashboard = [
    "streamlit>=1.50.0",
]

[tool.uv]
default-groups = ["data", "baselines"]

[tool.uv.sources]
# cu130 <--> captum
torch = { index = "pytorch-cu130" }
pyg-lib = { index = "pyg-torch214-cu130" }

# Official PyTorch CUDA 13.0 index.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# PyG's pip-style `-f` wheel page, represented as a uv flat index.
[[tool.uv.index]]
name = "pyg-torch214-cu130"
url = "https://data.pyg.org/whl/torch-2.14.0+cu130.html"
format = "flat"
explicit = true
